<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Установка kl!ck</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="win">
  <aside class="rail" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <img src="assets/key.png" alt="" class="key">
      <div>
        <div class="name">kl<b>!</b>ck</div>
        <div class="ver" id="ver">Установщик</div>
      </div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="grow" data-tauri-drag-region></div>
    <div class="legal">© 2026 vbu00<br>Дизайн — Dmitriy Medvedev<br>Лицензия MIT</div>
  </aside>
  <main>
    <div class="bar" data-tauri-drag-region>
      <button class="wbtn" id="minBtn" aria-label="Свернуть"><span class="ic" style="--i:url(assets/minimize.svg)"></span></button>
      <button class="wbtn close" id="closeBtn" aria-label="Закрыть"><span class="ic" style="--i:url(assets/close.svg)"></span></button>
    </div>
    <div id="screen"></div>
    <div id="dialog"></div>
  </main>
</div>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
