[workspace]
resolver = "2"
members = ["crates/klick-core", "crates/klick-proto", "crates/klick-service", "crates/klick-cli", "crates/klick-ui", "crates/klick-setup"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
klick-core = { path = "crates/klick-core" }
klick-proto = { path = "crates/klick-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
