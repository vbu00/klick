# Сборка и проверка kl!ck для Windows на раннерах GitHub: ядро mihomo (сверка SHA-256), build.ps1
# (окно, служба, klick-setup.exe), тесты. Потом на Windows Server 2022 и 2025 — те же сценарии, что
# в Песочнице Windows (sandbox\run.ps1, setup-test.ps1, ks-browser.ps1), каждый на чистой машине:
#   service    — служба, TUN, прокси, Kill Switch, падения, смена сети, удаление (run.ps1)
#   setup      — установщик поверх настоящей kl!ck 0.3.0 (собирается здесь же из vbu00/klick), все
#                проверки службы на установленной копии, переустановка, удаление (setup-test.ps1)
#   ks-browser — Edge в Kill Switch, VPN много раз включается и выключается (ks-browser.ps1)
#   real       — с настоящими серверами из подписки (real-test.ps1), только при ручном запуске со ссылкой.
#   servers    — серверы подписки под лупой: задержка, страж связи на каждом виде серверов, голое ядро,
#                свой сайт в «Только выбранном» (servers-test.ps1), тоже только со ссылкой.
# При ручном запуске можно собрать kl!ck из vbu00/klick как есть (main или тег выпуска, например
# v0.4.0) — проверки при этом из этой ветки, кроме ссылок klick://add (в выпусках до 0.5 их нет).
# Ссылка подписки не сохраняется в репозитории и скрыта в журнале.
# release_run — ничего не собирать, а выпустить установщик из зелёного запуска Windows (его номер):
# предвыпуск windows-<версия> с klick-<версия>-setup.exe — ровно тот файл, что прошёл проверки.
name: Windows

on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'scripts/macos/**', '.github/workflows/macos.yml']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'scripts/macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:
    inputs:
      source:
        description: Что собирать — эта ветка или vbu00/klick как есть
        type: choice
        options: ['branch', 'upstream']
        default: 'branch'
      upstream_ref:
        description: Ветка или тег vbu00/klick для source = upstream (main, v0.4.0…)
        required: false
        default: 'main'
      only:
        description: Только этот сценарий (service, setup, ks-browser, real, servers); пусто — все
        required: false
        default: ''
      sub:
        description: Ссылка подписки для проверки с настоящими серверами (необязательно)
        required: false
        default: ''
      release_run:
        description: Выпустить — номер зелёного запуска Windows; его установщик станет предвыпуском windows-<версия>
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.release_run == '' }}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Проверки (sandbox\, скрипты) — из этой ветки, программа — из vbu00/klick как есть.
      - name: Исходники kl!ck из vbu00/klick (${{ inputs.upstream_ref || 'main' }})
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source == 'upstream' }}
        env:
          REF: ${{ inputs.upstream_ref || 'main' }}
        run: |
          git fetch --depth 1 https://github.com/vbu00/klick $env:REF
          $app = 'crates', 'ui', 'resources', 'Cargo.toml', 'Cargo.lock', '.cargo', 'build.ps1', 'tools'
          git rm -r -q @app
          git checkout FETCH_HEAD -- @app
          git log -1 --format='%h %s' FETCH_HEAD
          Select-String -Path Cargo.toml -Pattern '^version'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust
        run: |
          rustup update stable
          rustup default stable
          rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Ядро и база стран не в git: tools\fetch-core.ps1 (его зовёт и build.ps1). Через cmd: Windows
      # PowerShell 5.1, запущенный из pwsh, получает чужой PSModulePath и не находит Get-FileHash.
      - name: Ядро mihomo и база стран (сверка SHA-256)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\fetch-core.ps1

      - name: Зависимости интерфейса
        working-directory: ui
        run: npm ci

      - name: Сборка (build.ps1)
        env:
          KLICK_RELEASES_REPO: vbu00/klick
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

      - name: Папка для проверок
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target\release\klick-service.exe, target\release\klick-cli.exe, target\release\klick.exe, dist\klick-setup.exe out
          Copy-Item resources out\resources -Recurse
          Get-ChildItem out -Recurse -File | ForEach-Object { '{0,10:N0}  {1}' -f $_.Length, $_.FullName.Substring((Resolve-Path out).Path.Length + 1) }

      - uses: actions/upload-artifact@v4
        with:
          name: klick-windows
          path: out

      # После выкладки сборки: если тесты упадут, сценарии всё равно проверят программу.
      # build.rs установщика берёт в архив klick.exe и klick-service.exe из target\<профиль>; отладочных
      # нет (build.ps1 собирает release) — берём release, иначе cargo test на чистой машине не соберётся.
      - name: Тесты
        env:
          KLICK_PAYLOAD_BIN: ${{ github.workspace }}\target\release
        run: cargo test --workspace

  # Прежняя kl!ck 0.3.0 из исходников vbu00/klick: её установщик NSIS ставится без окна (/S).
  old:
    if: ${{ inputs.release_run == '' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vbu00/klick
          ref: v0.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # cmd, а не pwsh: Windows PowerShell 5.1, запущенный из pwsh, получает чужой PSModulePath
      # и не находит Get-FileHash (его зовёт tools\fetch-core.ps1).
      - name: Сборка kl!ck 0.3.0 (NSIS)
        shell: cmd
        run: |
          call npm ci || exit /b 1
          call npm run core || exit /b 1
          call npx tauri build || exit /b 1
          dir src-tauri\target\release\bundle\nsis

      - uses: actions/upload-artifact@v4
        with:
          name: klick-0.3.0-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

  check:
    needs: [build, old]
    if: ${{ !cancelled() && inputs.release_run == '' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
        scenario: [service, setup, ks-browser, real, servers]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Скрыть ссылку подписки в журнале
        if: github.event_name == 'workflow_dispatch'
        run: |
          $sub = (Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).inputs.sub
          if ($sub) { Write-Host "::add-mask::$sub" }

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: klick-windows
          path: build

      - uses: actions/download-artifact@v4
        if: matrix.scenario == 'setup'
        with:
          name: klick-0.3.0-nsis
          path: old

      - uses: actions/setup-node@v4
        if: matrix.scenario == 'ks-browser'
        with:
          node-version: 22

      # real и servers — только со ссылкой; only — один сценарий из всех.
      - name: Сценарий ${{ matrix.scenario }}
        if: >-
          (inputs.only == '' || inputs.only == matrix.scenario) &&
          ((matrix.scenario != 'real' && matrix.scenario != 'servers') || (github.event_name == 'workflow_dispatch' && inputs.sub != ''))
        shell: pwsh
        run: |
          $map = @{ service = 'run'; setup = 'setup'; 'ks-browser' = 'ks-browser'; real = 'real'; servers = 'servers' }
          $old = Get-ChildItem old -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ('${{ matrix.scenario }}' -in 'real', 'servers') {
            $env:KLICK_TEST_SUB = (Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).inputs.sub
          }
          # Сборка vbu00/klick как есть — без ссылок klick://add: их проверки пропускаются.
          if ('${{ inputs.source }}' -eq 'upstream') { $env:KLICK_NO_DEEPLINK = '1' }
          $a = @{ Scenario = $map['${{ matrix.scenario }}']; Build = (Resolve-Path build).Path }
          if ($old) { $a.Old = $old.FullName }
          & sandbox\ci.ps1 @a
          exit $LASTEXITCODE

      # Отчёты и журнал службы — для разбора. Кроме проверок с подпиской: артефакты видны всем с доступом к репозиторию.
      - uses: actions/upload-artifact@v4
        if: always() && matrix.scenario != 'real' && matrix.scenario != 'servers'
        with:
          name: results-${{ matrix.runner }}-${{ matrix.scenario }}
          path: C:\klick\results
          if-no-files-found: ignore

  # Выпуск проверенного установщика — предвыпуском: «последним» выпуском остаётся сборка для Mac
  # (на releases/latest смотрят команда установки из README и проверка обновлений на Mac).
  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_run != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Запуск Windows зелёный
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.release_run }}
        run: |
          IFS=$'\t' read -r name conclusion sha < <(gh api "repos/${{ github.repository }}/actions/runs/$RUN" --jq '[.name, .conclusion, .head_sha] | @tsv')
          echo "запуск $RUN: $name, $conclusion, $sha"
          if [ "$name" != "Windows" ] || [ "$conclusion" != "success" ]; then
            echo "::error::выпускаю только из зелёного запуска Windows"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.run.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: klick-windows
          path: build
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}

      - name: Предвыпуск windows-<версия>
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.run.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.release_run }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          exe="klick-$v-setup.exe"
          cp build/klick-setup.exe "$exe"
          sum=$(sha256sum "$exe" | cut -d' ' -f1)
          cat > notes.md <<NOTES
          Установщик kl!ck $v для Windows 10/11 x64 — проверочная сборка, основа — kl!ck 0.4.0 из vbu00/klick.

          **Что исправлено против 0.4.0**
          - Страж связи не рвёт работающий VPN: если через сервер идут данные, неудачная проверка ничего не трогает — без «Переподключаюсь», перезапуска ядра и «Сервер не отвечает».
          - Проверка связи ждёт ответа 10 с вместо 5.
          - Задержка в списке серверов меряется по каждому серверу отдельно, по 6 сразу, — в плохой сети больше не «нет ответа» у всех.

          **Установка:** запустить \`$exe\` поверх прежней kl!ck — подключения и настройки остаются. В «О приложении» будет $v.

          SHA-256: \`$sum\`
          Сборка ${SHA:0:7}, проверки на Windows Server 2022 и 2025: $RUN_URL
          NOTES
          tag="windows-$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$exe" --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" "$exe" --prerelease --latest=false --target "$SHA" --title "kl!ck $v для Windows (проверка)" --notes-file notes.md
          fi
          echo "$exe: $sum"
