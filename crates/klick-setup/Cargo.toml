[package]
name = "klick-setup"
description = "Установщик kl!ck: установка, обновление, удаление"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "klick_setup"
path = "src/lib.rs"

[[bin]]
name = "klick-setup"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies]
serde.workspace = true
serde_json.workspace = true

# Установщик — только для Windows: на macOS kl!ck ставится пакетом .pkg (scripts/macos).
[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Networking_WinInet",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
klick-core.workspace = true

[features]
# Страница окна вшивается в exe; без этого окно ждёт сервер разработки Vite.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
