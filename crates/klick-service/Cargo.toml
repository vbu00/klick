[package]
name = "klick-service"
description = "Служба kl!ck: ядро, Kill Switch, подписки, канал управления (Windows и macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
klick-core.workspace = true
klick-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", features = ["gzip", "json"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
# Проверка подписи обновлений (Ed25519).
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
aes-gcm = "0.10"
getrandom = "0.3"
plist = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
# Слежка за папками программ Kill Switch: ReadDirectoryChangesW с именами файлов.
notify = { version = "8", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Rpc",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Environment",
]
