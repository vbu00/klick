[package]
name = "klick-native"
description = "kl!ck для iOS с родным интерфейсом (SwiftUI): движок службы в приложении, без веб-окна"
# Та же версия, что у всего kl!ck (Cargo.toml в корне); scripts/ios/build-native.sh сверяет.
version = "0.5.4"
edition = "2021"
license = "MIT"

# Своё рабочее пространство, как у crates/klick-ios: собирается только под iOS.
[workspace]

[lib]
name = "klick_native"
crate-type = ["staticlib"]

[dependencies]
klick-core = { path = "../klick-core" }
klick-proto = { path = "../klick-proto" }
klick-service = { path = "../klick-service" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
