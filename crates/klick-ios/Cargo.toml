[package]
name = "klick-ios"
description = "kl!ck для iOS: окно, движок службы в приложении, туннель — расширение Network Extension"
# Та же версия, что у всего kl!ck (Cargo.toml в корне); scripts/ios/build.sh сверяет.
version = "0.5.4"
edition = "2021"
license = "MIT"

# Своё рабочее пространство: зависимости iOS (Tauri для iOS) не попадают в сборки Windows и macOS.
[workspace]

[lib]
name = "klick_ios"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
klick-core = { path = "../klick-core" }
klick-proto = { path = "../klick-proto" }
klick-service = { path = "../klick-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
libc = "0.2"

[features]
# Страница окна вшивается в приложение; без этого окно ждёт сервер разработки Vite.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
